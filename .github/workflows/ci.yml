name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: dreamnet demo --output artifacts/smoke --train 28 --test 14 --candidates 80
      - run: dreamnet bgp-demo --fixtures examples/fixtures --output artifacts/bgp-smoke
